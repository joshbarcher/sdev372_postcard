name: CI

on:
  push:
    branches: [main]

env:
  IMAGE: us-west1-docker.pkg.dev/<project>/postcard/api

jobs:
  postcard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/setup-gcloud@v3
      - run: |
          gcloud auth configure-docker \
            us-west1-docker.pkg.dev
      - run: docker build -t $IMAGE:$GITHUB_SHA .
      - run: docker push $IMAGE:$GITHUB_SHA
      - run: |
          gcloud run deploy postcard-api \
            --image $IMAGE:$GITHUB_SHA \
            --region us-west1 \
            --allow-unauthenticated \
            --set-env-vars APP_VERSION=$GITHUB_SHA
      - run: |
          URL=$(gcloud run services describe \
            postcard-api --region us-west1 \
            --format 'value(status.url)')
          curl -s "$URL/api/config" | grep "$GITHUB_SHA"

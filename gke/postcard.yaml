# Postcard on GKE: the API and the front end, each a Deployment with a Service.
# Replace `you` in the two image lines with your Docker Hub username.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postcard-api
  template:
    metadata:
      labels:
        app: postcard-api
    spec:
      containers:
        - name: api
          image: you/postcard-api:1
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: postcard-api
  ports:
    - port: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postcard-web
  template:
    metadata:
      labels:
        app: postcard-web
    spec:
      containers:
        - name: web
          image: you/postcard-web:1
---
apiVersion: v1
kind: Service
metadata:
  name: postcard-web
spec:
  type: LoadBalancer
  selector:
    app: postcard-web
  ports:
    - port: 80

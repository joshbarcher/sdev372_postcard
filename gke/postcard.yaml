# Postcard in one file: the database, the API and the front end.
# Before applying it, replace `you` in the two image lines with your
# Docker Hub username. The Secret is not in here; create it first:
#
#   kubectl create secret generic postcard \
#     --from-literal=ADMIN_TOKEN=pick-one \
#     --from-literal=DB_PASSWORD=pick-two \
#     --from-literal=ROOT_PASSWORD=pick-three \
#     --from-literal=DATABASE_URL=mysql://postcard:pick-two@db:3306/postcard
#
#   kubectl apply -f gke/postcard.yaml
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postcard-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-db
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postcard-db
  template:
    metadata:
      labels:
        app: postcard-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          env:
            - name: MARIADB_DATABASE
              value: postcard
            - name: MARIADB_USER
              value: postcard
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postcard, key: DB_PASSWORD }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: postcard, key: ROOT_PASSWORD }
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postcard-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app: postcard-db
  ports:
    - port: 3306
      targetPort: 3306
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postcard-api
  template:
    metadata:
      labels:
        app: postcard-api
    spec:
      containers:
        - name: api
          image: you/postcard-api:1
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: postcard
                  key: DATABASE_URL
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: postcard
                  key: ADMIN_TOKEN
            - name: APP_VERSION
              value: "1.0.0"
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /ready, port: 8080 }
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  type: ClusterIP
  selector:
    app: postcard-api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postcard-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postcard-web
  template:
    metadata:
      labels:
        app: postcard-web
    spec:
      containers:
        - name: web
          image: you/postcard-web:1
          ports:
            - containerPort: 80
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postcard-web
spec:
  type: LoadBalancer
  selector:
    app: postcard-web
  ports:
    - port: 80
      targetPort: 80

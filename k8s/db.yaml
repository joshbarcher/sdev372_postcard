apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postcard-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
spec:
  # ONE. Not two. Two MariaDB pods on one ReadWriteOnce volume is data
  # corruption, not high availability -- scaling a database is a different
  # subject and this is not it.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postcard-db
  template:
    metadata:
      labels:
        app: postcard-db
    spec:
      containers:
        - name: mariadb
          image: mariadb:11.8
          env:
            - name: MARIADB_DATABASE
              value: postcard
            - name: MARIADB_USER
              value: postcard
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef: { name: postcard, key: DB_PASSWORD }
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: postcard, key: ROOT_PASSWORD }
          ports:
            - containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postcard-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  type: ClusterIP
  selector:
    app: postcard-db
  ports:
    - port: 3306
      targetPort: 3306

# Create the real one from the command line so it never exists as a file:
#
#   kubectl create secret generic postcard \
#     --from-literal=ADMIN_TOKEN=... \
#     --from-literal=DB_PASSWORD=... \
#     --from-literal=ROOT_PASSWORD=... \
#     --from-literal=DATABASE_URL=mysql://postcard:...@postcard-db:3306/postcard
#
# A Secret is base64, NOT encryption. `kubectl get secret postcard -o yaml`
# prints it back and anyone can decode it. It keeps values out of the manifests
# and out of git; it does not keep them from someone with cluster access.
apiVersion: v1
kind: Secret
metadata:
  name: postcard
type: Opaque
stringData:
  ADMIN_TOKEN: change-me
  DB_PASSWORD: s3cr3t
  ROOT_PASSWORD: also-change-me
  DATABASE_URL: mysql://postcard:s3cr3t@postcard-db:3306/postcard

server {
	listen 80;

	# The page is a single HTML file. Any path that is not a real file has to
	# fall back to it, or a refresh on a sub-path 404s.
	location / {
		root /usr/share/nginx/html;
		try_files $uri $uri/ /index.html;
	}

	# One origin for the browser. `api` is the service name from compose --
	# Docker's own DNS resolves it, which is why no address is written here.
	location /api/ {
		proxy_pass http://api:8080;
		proxy_set_header Host $host;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	}
}
